
<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una historia para nosotros</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #05030a;
  color: #fff;
  font-family: Georgia, serif;
  overflow: hidden;
}

.screen {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 28px;
  background:
    radial-gradient(ellipse at 50% 45%,
      rgba(125, 24, 63, 0.35) 0%,
      transparent 55%),
    radial-gradient(ellipse at bottom,
      #351020 0%,
      #130b1a 50%,
      #05030a 100%);
}
.screen::after {
  content: "";
  position: absolute;
  top: 8%;
  right: 8%;
  width: 95px;
  height: 95px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 35%,
    #ffffff 0%,
    #fff0f6 35%,
    #e6a6c7 65%,
    #a94b78 100%
  );
  box-shadow:
    0 0 15px rgba(255, 230, 245, 0.9),
    0 0 35px rgba(255, 150, 200, 0.7),
    0 0 65px rgba(255, 80, 150, 0.4);
  animation: moonShine 3s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 0;
}

@keyframes moonShine {
  from {
    filter: brightness(0.9);
    box-shadow: 0 0 15px rgba(255, 230, 245, 0.7),
                0 0 30px rgba(255, 150, 200, 0.5);
  }
  to {
    filter: brightness(1.3);
    box-shadow: 0 0 25px rgba(255, 255, 255, 1),
                0 0 55px rgba(255, 150, 200, 0.9),
                0 0 85px rgba(255, 80, 150, 0.5);
  }
}

.screen > * {
  position: relative;
  z-index: 1;
}
.stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    radial-gradient(white 1px, transparent 1.5px),
    radial-gradient(#d58ab7 1px, transparent 1.5px),
    radial-gradient(#a94b70 1px, transparent 2px);
  background-size: 75px 75px, 130px 130px, 190px 190px;
  background-position: 0 0, 35px 60px, 80px 20px;
  opacity: 0.45;
  animation: starGlow 5s ease-in-out infinite alternate;
}

.rose {
  font-size: 48px;
  filter: drop-shadow(0 0 18px #c51b52);
  animation: pulse 3s infinite;
  margin-bottom: 5px;
}

h1 {
  color: #f1c5d8;
  font-size: 32px;
  font-weight: normal;
  margin: 20px 0;
}

p {
  color: #d8c5d8;
  font-size: 18px;
  line-height: 1.8;
  max-width: 450px;
}

button {
  margin-top: 30px;
  padding: 15px 30px;
  background: #741b3b;
  color: white;
  border: 1px solid #d69ab5;
  border-radius: 30px;
  font-family: Georgia, serif;
  font-size: 17px;
  cursor: pointer;
}

button:active {
  transform: scale(0.96);
}

#message {
  min-height: 150px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.hidden {
  display: none !important;
}

.fade {
  animation: appear 1.5s ease;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
.petal {
  position: fixed;
  top: -30px;
  z-index: 3;
  pointer-events: none;
  animation: falling linear forwards;
  opacity: 0;
}

@keyframes falling {
  0% {
    transform: translateY(-10vh) rotate(0deg);
    opacity: 0;
  }

  10% {
    opacity: 0.8;
  }

  90% {
    opacity: 0.7;
  }

  100% {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}
@keyframes starGlow {
  0% {
    opacity: 0.25;
    transform: scale(1);
  }
  100% {
    opacity: 0.65;
    transform: scale(1.03);
  }
}
.couple-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin: 8px 0 20px;
  position: relative;
}

.character {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  animation: floatCharacter 4s ease-in-out infinite;
}

.character span {
  font-size: 75px;
  filter: drop-shadow(0 0 15px rgba(190, 55, 105, 0.5));
}

.character small {
  color: #dca6c3;
  letter-spacing: 3px;
  font-size: 10px;
}

.carmilla {
  animation-delay: 1.5s;
}

.heart-between {
  color: #ff547f;
  font-size: 25px;
  text-shadow: 0 0 15px #ff174f;
  animation: heartPulse 1.5s infinite;
}

@keyframes floatCharacter {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

@keyframes heartPulse {
  0%, 100% {
    transform: scale(1);
    opacity: 0.7;
  }
  50% {
    transform: scale(1.3);
    opacity: 1;
  }
}
</style>
</head>

<body>

<div class="stars"></div>

<main class="screen">
    <div class="rose">🌹</div>
<div class="couple-stage">
  <div id="special-heart">♥</div>
<img src="pareja.png"
     alt="Cecilion y Carmilla"
     class="couple-image"
     style="width:150px; height:auto; display:block; margin:10px auto;">
  <div class="couple-caption">
    CECILION <span>♥</span> CARMILLA
  </div>
</div>
  <h1 id="title">Una historia de dos almas</h1>

  <div id="message">
    <p>
      Hay historias que parecen escritas por el destino...
      y otras que comienzan cuando conoces a alguien
      que hace que todo tenga sentido.
    </p>
  </div>
<button id="next">Comenzar nuestra historia</button>
<audio id="background-music" loop></audio>
<div id="music-label">♫ Perfect — Ed Sheeran</div>
<button id="music-control">♫ Escuchar Perfect ❤️</button>
</main>

<script>
const title = document.getElementById("title");
const message = document.getElementById("message");
const button = document.getElementById("next");
const musicControl = document.getElementById("music-control");

musicControl.addEventListener("click", () => {
  window.open(
    "https://music.youtube.com/search?q=Perfect+Ed+Sheeran",
    "_blank"
  );
});

const scenes = [
{
title: "Cecilion",
text: "Durante mucho tiempo, incluso la eternidad parecía no tener sentido... hasta que apareció alguien capaz de cambiarlo todo."
},
{
title: "Carmilla",
text: "Y entonces llegó ella. Alguien que convirtió la oscuridad en un lugar menos frío, y que hizo que hasta la noche tuviera luz."
},
{
title: "Dos almas, un destino",
text: "Como Cecilion y Carmilla, hay personas que uno simplemente no quiere perder. Personas que desea elegir una y otra vez, sin importar cuántos días pasen."
},
{
title: "Una pregunta...",
text: "Hoy no quiero que esta historia sea solamente la de dos personajes. Quiero que hable de nosotros, de lo que sentimos y de todo lo que aún nos queda por vivir."
},
{
title: "❤️",
text: "¿Te gustaría escribir conmigo nuestra propia historia, caminar juntos por todos los días que nos esperan y algún día... casarnos?"
}
];

let current = 0;
title.classList.add("fade");
message.classList.add("fade");
button.addEventListener("click", () => {
  const music = document.getElementById("background-music");

if (music.paused) {
  music.play();
}
  
if (current < scenes.length) {
title.textContent = scenes[current].title;
message.innerHTML = "<p>" + scenes[current].text + "</p>";

title.classList.remove("fade");  
message.classList.remove("fade");  

void title.offsetWidth;  

title.classList.add("fade");  
message.classList.add("fade");  

current++;

if (current === scenes.length) {
  document.body.classList.add("special-moment");

  clearInterval(petalInterval);
  petalInterval = setInterval(createPetal, 350);

  button.textContent = "Mi respuesta es para ti ❤️";
} else {  
  button.textContent = "Continuar";  
}

} else {
title.textContent = "Nuestra historia apenas comienza";
message.innerHTML = `
  <p>Te quiero ❤️</p>
  <p class="final-dedication">
    Si pudiera volver a elegir, volvería a encontrarte.
    Porque entre tantas personas, mi historia favorita
    siempre será la que escribo contigo.
  </p>
`;

title.classList.remove("fade");
message.classList.remove("fade");

void title.offsetWidth;

title.classList.add("final-reveal");
message.classList.add("final-reveal");

button.classList.add("hidden");
}
});
function createPetal() {
const petal = document.createElement("div");
petal.className = "petal";
petal.innerHTML = "🌹";

petal.style.left = Math.random() * 100 + "vw";
petal.style.fontSize = (12 + Math.random() * 14) + "px";
petal.style.animationDuration = (6 + Math.random() * 7) + "s";

document.body.appendChild(petal);

setTimeout(() => {
petal.remove();
}, 13000);
}

let petalInterval = setInterval(createPetal, 900);
function createSparkle() {
const sparkle = document.createElement("div");
sparkle.className = "sparkle";
sparkle.innerHTML = "✦";

sparkle.style.left = Math.random() * 100 + "vw";
sparkle.style.top = Math.random() * 100 + "vh";
sparkle.style.animationDuration = (2 + Math.random() * 3) + "s";

document.body.appendChild(sparkle);

setTimeout(() => sparkle.remove(), 5000);
}

setInterval(createSparkle, 500);
</script>

</body>  
</html>
